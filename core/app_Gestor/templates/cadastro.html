{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <title>Cadastro</title>
</head>

<body>

  <main class="container">

    <form method="post">
      {% csrf_token %}

      <h1 class="enter" style="--i:0">Criar Conta</h1>

      {% if erro %}
        <p class="enter" style="--i:1;color:#fff;background:rgba(195,28,30,0.6);border-radius:8px;padding:10px 15px;margin-bottom:15px;font-size:14px;text-align:center;" role="alert">
          {{ erro }}
        </p>
      {% endif %}

      <div class="input-box enter" style="--i:2">
        <input name="username" value="{{ username|default:'' }}" placeholder="Usuário" type="text" required>
        <i class="bx bxs-id-card" aria-hidden="true"></i>
      </div>

      <div class="input-box enter" style="--i:3">
        <input name="senha" placeholder="Senha" type="password" required>
        <i class="bx bxs-lock-alt" aria-hidden="true"></i>
      </div>

      <div class="input-box enter" style="--i:4">
        <input name="confirmar_senha" placeholder="Confirmar senha" type="password" required>
        <i class="bx bxs-lock-alt" aria-hidden="true"></i>
      </div>

      <button type="submit" class="login enter" style="--i:5">Cadastrar</button>

      <div class="register-link enter" style="--i:6">
        <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login</a></p>
      </div>

    </form>

  </main>

</body>

</html>
