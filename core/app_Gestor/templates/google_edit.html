{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cliente</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/cert_manager.css' %}">
</head>
<body>
  <div style="max-width:900px;margin:40px auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.05);">
    <h1 style="margin-bottom:4px;font-size:22px;">Editar Cliente</h1>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px">As alterações são gravadas direto na planilha do Google Drive.</p>

    {% if messages %}
      <div role="alert">
        {% for message in messages %}
          <div style="padding:10px 14px;border-radius:8px;margin-bottom:14px;background:{% if message.tags == 'error' %}#fdecea{% else %}#fff4e5{% endif %};color:#333;font-size:13px">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="expected_atualizado_em" value="{{ registro.atualizado_em }}">
      <fieldset class="modal-fieldset">
        <legend>Dados do Cliente</legend>
        <div class="form-grid">
          <div class="field form-full"><label for="id-cliente">Nome do Cliente <span aria-hidden="true" style="color:var(--danger)">*</span></label><input id="id-cliente" name="cliente" value="{{ registro.cliente }}" placeholder="Nome completo" autocomplete="name" required aria-required="true"></div>
          <div class="field"><label for="id-cpf">CPF / CNPJ</label><input id="id-cpf" name="cpf_cnpj" value="{{ registro.cpf_cnpj }}" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label for="id-email">E-mail</label><input id="id-email" name="email" type="email" value="{{ registro.email }}" placeholder="email@exemplo.com" autocomplete="email"></div>
          <div class="field"><label for="id-tel1">Telefone</label><input id="id-tel1" name="telefone1" type="tel" value="{{ registro.telefone1 }}" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel"></div>
          <div class="field"><label for="id-tel2">Telefone 2</label><input id="id-tel2" name="telefone2" type="tel" value="{{ registro.telefone2 }}" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel"></div>
          <div class="field"><label for="id-parceiro">Contador/Parceiro</label>
            <select id="id-parceiro" name="contador_parceiro">
              <option value="">Nenhum / Direto</option>
              {% for p in parceiros %}
                <option value="{{ p.nome }}" {% if p.nome == registro.contador_parceiro %}selected{% endif %}>{{ p.nome }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field"><label for="id-contabilidade">Contador/Contabilidade</label><input id="id-contabilidade" name="contador_contabilidade" value="{{ registro.contador_contabilidade }}" autocomplete="off"></div>
          <div class="field"><label for="id-status">Status do Atendimento</label>
            <select id="id-status" name="status">
              {% for opcao in status_opcoes %}
                <option {% if registro.status == opcao %}selected{% endif %}>{{ opcao }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset class="modal-fieldset">
        <legend>Certificado &amp; Venda</legend>
        <div class="form-grid">
          <div class="field"><label for="id-tipo">Tipo de Certificado</label>
            <select id="id-tipo" name="tipo_certificado">
              <option value="">Selecione...</option>
              {% for p in precos %}
                <option value="{{ p.tipo }}" data-validade="{{ p.validade }}" {% if p.tipo == registro.tipo_certificado %}selected{% endif %}>{{ p.tipo }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field"><label for="id-datavenda">Data da Venda</label><input id="id-datavenda" name="data_venda" type="date" value="{{ registro.data_venda }}"></div>
          <div class="field"><label for="id-datavenc">Data de Vencimento</label><input id="id-datavenc" name="data_vencimento" type="date" value="{{ registro.data_vencimento }}" readonly></div>
          <div class="field{% if not pode_ver_financeiro %} field-locked{% endif %}"><label for="id-valorvenda">Valor da Venda (R$){% if not pode_ver_financeiro %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label><input id="id-valorvenda" name="valor_venda" type="number" step="0.01" min="0" inputmode="decimal" value="{{ registro.valor_venda }}" placeholder="0,00" {% if not pode_ver_financeiro %}disabled{% endif %}></div>
          <div class="field{% if not pode_ver_comissao %} field-locked{% endif %}"><label for="id-percentual">Percentual de Comissão (%){% if not pode_ver_comissao %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label><input id="id-percentual" name="percentual_comissao" type="number" step="0.01" min="0" inputmode="decimal" value="{{ registro.percentual_comissao }}" placeholder="0,00" {% if not pode_ver_comissao %}disabled{% endif %}></div>
          <div class="field{% if not pode_ver_comissao %} field-locked{% endif %}"><label for="id-valorcomissao">Valor da Comissão (R$){% if not pode_ver_comissao %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label><input id="id-valorcomissao" name="valor_comissao" type="number" step="0.01" min="0" inputmode="decimal" value="{{ registro.valor_comissao }}" placeholder="0,00" {% if not pode_ver_comissao %}disabled{% endif %}></div>
          <div class="field{% if not pode_ver_financeiro %} field-locked{% endif %}"><label for="id-custocert">Custo do Certificado (R$){% if not pode_ver_financeiro %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label><input id="id-custocert" name="custo_certificado" type="number" step="0.01" min="0" inputmode="decimal" value="{{ registro.custo_certificado }}" placeholder="0,00" {% if not pode_ver_financeiro %}disabled{% endif %}></div>
          <div class="field{% if not pode_ver_financeiro %} field-locked{% endif %}"><label for="id-valorliquido">Valor Líquido (R$){% if not pode_ver_financeiro %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label><input id="id-valorliquido" name="valor_liquido" type="number" step="0.01" min="0" inputmode="decimal" value="{{ registro.valor_liquido }}" placeholder="0,00" {% if not pode_ver_financeiro %}disabled{% endif %}></div>
          <div class="field"><label for="id-venda">Venda</label><input id="id-venda" name="venda" value="{{ registro.venda }}" autocomplete="off"></div>
          <div class="field"><label for="id-certfeito">Certificado Feito?</label>
            <select id="id-certfeito" name="certificado_feito">
              <option value="Não" {% if not registro.certificado_feito %}selected{% endif %}>Não</option>
              <option value="Sim" {% if registro.certificado_feito %}selected{% endif %}>Sim</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset class="modal-fieldset">
        <legend>Pagamento</legend>
        <div class="form-grid">
          <div class="field"><label for="id-formapag">Forma de Pagamento</label><input id="id-formapag" name="forma_pagamento" value="{{ registro.forma_pagamento }}" placeholder="Pix, Boleto, Cartão..." autocomplete="off"></div>
          <div class="field"><label for="id-banco">Banco</label><input id="id-banco" name="banco" value="{{ registro.banco }}" autocomplete="off"></div>
          <div class="field"><label for="id-pix">Chave PIX</label><input id="id-pix" name="chave_pix" value="{{ registro.chave_pix }}" autocomplete="off"></div>
          <div class="field"><label for="id-pagovenda">Pago (Venda)</label>
            <select id="id-pagovenda" name="pago_venda">
              <option value="Não" {% if not registro.pago_venda %}selected{% endif %}>Não</option>
              <option value="Sim" {% if registro.pago_venda %}selected{% endif %}>Sim</option>
            </select>
          </div>
          <div class="field{% if not pode_ver_comissao %} field-locked{% endif %}"><label for="id-pagocomissao">Pago (Comissão){% if not pode_ver_comissao %} <i class="ti ti-lock" title="Requer permissão de administrador"></i>{% endif %}</label>
            <select id="id-pagocomissao" name="pago_comissao" {% if not pode_ver_comissao %}disabled{% endif %}>
              <option value="Não" {% if not registro.pago_comissao %}selected{% endif %}>Não</option>
              <option value="Sim" {% if registro.pago_comissao %}selected{% endif %}>Sim</option>
            </select>
          </div>
        </div>
      </fieldset>
      <div style="display:flex;gap:12px;align-items:center;margin-top:22px">
        <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy" aria-hidden="true"></i> Salvar alterações</button>
        <a href="{% url 'dashboard' %}#clientes" class="btn">Cancelar</a>
      </div>
    </form>
  </div>
  <script src="{% static 'js/cert_manager.core.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var cpf = document.getElementById('id-cpf');
      var tel1 = document.getElementById('id-tel1');
      var tel2 = document.getElementById('id-tel2');
      if(cpf){ cpf.value = maskCpfCnpj(cpf.value); cpf.addEventListener('input', function(){ this.value = maskCpfCnpj(this.value); }); }
      if(tel1){ tel1.value = maskTelefone(tel1.value); tel1.addEventListener('input', function(){ this.value = maskTelefone(this.value); }); }
      if(tel2){ tel2.value = maskTelefone(tel2.value); tel2.addEventListener('input', function(){ this.value = maskTelefone(this.value); }); }

      var tipoSel = document.getElementById('id-tipo');
      var dataVenda = document.getElementById('id-datavenda');
      var dataVenc = document.getElementById('id-datavenc');
      function recalcularVencimento(){
        if(!dataVenda.value) return;
        var opt = tipoSel.options[tipoSel.selectedIndex];
        var dias = parseValidadeToDays(opt && opt.dataset.validade) ?? 365;
        dataVenc.value = addDays(dataVenda.value, dias);
      }
      if(tipoSel) tipoSel.addEventListener('change', recalcularVencimento);
      if(dataVenda) dataVenda.addEventListener('change', recalcularVencimento);
    });
  </script>
</body>
</html>
