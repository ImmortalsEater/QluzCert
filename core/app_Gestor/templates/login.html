{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <title>Login</title>
</head>

<body>

  <main class="container">

    <form method="post">
      {% csrf_token %}

      <h1>Login</h1>

      {% if form.errors %}
        <p role="alert" style="color:#fff;background:rgba(195,28,30,0.6);border-radius:8px;padding:10px 15px;margin-bottom:15px;font-size:14px;text-align:center;">
          Usuário ou senha inválidos.
        </p>
      {% endif %}

      <div class="input-box">
        <input name="username" placeholder="Usuário" type="text" autofocus required>
        <i class="bx bxs-user" aria-hidden="true"></i>
      </div>

      <div class="input-box">
        <input name="password" placeholder="Senha" type="password" required>
        <i class="bx bxs-lock-alt" aria-hidden="true"></i>
      </div>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit" class="login">Login</button>

    </form>

  </main>

</body>

</html>
