{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="192x192" href="{% static 'img/favicon/favicon-192x192.png' %}">
  <title>Login</title>
</head>

<body>

  <main class="container">

    <form>

      <h1>Login</h1>

      <div class="input-box">
        <input placeholder="Usuário" type="email" required>
        <i class="bx bxs-user" aria-hidden="true"></i>
      </div>

      <div class="input-box">
        <input placeholder="Senha" type="password" required>
        <i class="bx bxs-lock-alt" aria-hidden="true"></i>
      </div>

      <div class="remember-forgot">
        <label>
          <input type="checkbox">
          Lembrar Senha
        </label>
        <a href="{% url 'recuperar_senha_preview' %}">Esqueci Senha</a>
      </div>

      <button type="submit" class="login">Login</button>

      <div class="register-link">
        <p>Não tem uma conta? <a href="{% url 'cadastro_preview' %}">Cadastre-se</a></p>
      </div>

    </form>

  </main>

</body>

</html>
